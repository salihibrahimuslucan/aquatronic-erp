<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquatronic ERP</title>
    <link rel="icon" type="image/png" href="./aquatronic-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/base.css">
    <link rel="stylesheet" href="/src/styles/app.css">
    <link rel="stylesheet" href="/src/styles/crm.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo-container">
                    <img src="./aquatronic-logo.png" alt="Aquatronic" class="brand-logo">
                </div>
                <div class="brand-info">
                    <h2>AQUATRONIC</h2>
                    <span>WATER ATTRACTIONS · ERP</span>
                </div>
            </div>

            <nav class="nav-menu" id="nav-menu"><!-- main.js OP_GROUPS'tan doldurur --></nav>

            <div class="sidebar-footer">
                <div class="user-profile-simple">
                    <div class="user-avatar">S</div>
                    <div class="user-text">
                        <h4>Salih</h4>
                        <span>Yönetici</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1 id="page-title-text">Genel Bakış</h1>
                    <p id="page-subtitle-text">Aquatronic üretim, stok ve teklif kontrol arayüzü.</p>
                </div>
                <div class="header-actions">
                    <div class="live-clock" id="live-time">--:--:--</div>
                </div>
            </header>

            <div class="viewport" id="view-root"></div>
        </main>
    </div>

    <div class="toast" id="toast-notif">
        <div class="toast-body">
            <span class="toast-indicator"></span>
            <p id="toast-text"></p>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
