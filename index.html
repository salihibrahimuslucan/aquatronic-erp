<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquatronic ERP</title>
    <link rel="icon" type="image/png" href="./aquatronic-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/base.css">
    <link rel="stylesheet" href="/src/styles/app.css">
    <link rel="stylesheet" href="/src/styles/crm.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo-container">
                    <img src="./aquatronic-logo.png" alt="Aquatronic" class="brand-logo">
                </div>
                <div class="brand-info">
                    <h2>AQUATRONIC</h2>
                    <span>WATER ATTRACTIONS · ERP</span>
                </div>
            </div>

            <nav class="nav-menu" id="nav-menu"><!-- main.js OP_GROUPS'tan doldurur --></nav>

            <div class="sidebar-footer">
                <div class="user-profile-simple">
                    <div class="user-avatar" id="user-avatar">S</div>
                    <div class="user-text">
                        <h4 id="user-name">Salih</h4>
                        <span id="user-role">Yönetici</span>
                    </div>
                    <button class="btn-logout" id="btn-logout" title="Çıkış yap" hidden>⏻</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-lead">
                    <button class="burger-btn" id="burger-btn" aria-label="Menüyü aç/kapat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <div class="header-title">
                        <h1 id="page-title-text">Aktif Üretim</h1>
                        <p id="page-subtitle-text">Aquatronic üretim ve stok kontrol arayüzü.</p>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="live-clock" id="live-time">--:--:--</div>
                </div>
            </header>

            <div class="viewport" id="view-root"></div>
        </main>

        <div class="nav-backdrop" id="nav-backdrop"></div>
    </div>

    <div class="login-overlay" id="login-overlay" hidden>
        <div class="login-card bg-glass">
            <img src="./aquatronic-logo.png" alt="Aquatronic" class="login-logo">
            <h2>AQUATRONIC <span>ERP</span></h2>
            <p class="login-sub">Devam etmek için giriş yapın</p>
            <form id="login-form" class="login-form">
                <input type="email" id="login-email" placeholder="E-posta" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" enterkeyhint="next">
                <input type="password" id="login-pass" placeholder="Şifre" autocomplete="current-password" enterkeyhint="go">
                <button class="btn btn-primary" id="login-go" type="submit">Giriş Yap</button>
            </form>
            <p class="login-error" id="login-error" hidden></p>
        </div>
    </div>

    <div class="toast" id="toast-notif">
        <div class="toast-body">
            <span class="toast-indicator"></span>
            <p id="toast-text"></p>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
